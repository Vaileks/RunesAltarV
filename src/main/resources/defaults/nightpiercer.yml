# Weapon settings. Damage: HP (2 HP = 1 heart). Durations ending in -ticks: 20 ticks = 1 second.
# Existing ability durations/cooldowns retain their original units. Potion amplifiers are zero-based unless stated otherwise.
# Tuning/visual fields keep original values by default. Reload with /al reload (integrated) or /rav reload (standalone).
# Sounds: enum names, relative volume/pitch multipliers. Particle density: 0..4. Attributes: additive main-hand bonuses.

name: Пронзатель ночи
lore-description:
- Оружие ночного охотника. Его лезвие ищет чужую жизнь среди теней.
lore-abilities:
- F — подготовить укус, ЛКМ — выпустить его и похитить здоровье.
- Shift + F — превратиться в летучую мышь и устремиться вперёд.
