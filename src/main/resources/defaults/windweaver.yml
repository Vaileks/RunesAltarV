# Weapon settings. Damage: HP (2 HP = 1 heart). Durations ending in -ticks: 20 ticks = 1 second.
# Existing ability durations/cooldowns retain their original units. Potion amplifiers are zero-based unless stated otherwise.
# Tuning/visual fields keep original values by default. Reload with /al reload (integrated) or /rav reload (standalone).
# Sounds: enum names, relative volume/pitch multipliers. Particle density: 0..4. Attributes: additive main-hand bonuses.

name: Ветроплёт
lore-description:
- Оружие странника небес. Невидимые потоки поднимают владельца и сметают тех, кто
  преграждает путь.
lore-abilities:
- F — воздушный рывок.
- Shift + F — накопить и выпустить порыв ветра.
item:
  material: NETHERITE_SWORD
  custom-model-data: 12
  item-model: ''
  tooltip-style: minecraft:pure
  attack-damage-bonus: 0.0
  attack-speed-bonus: 0.0
abilities:
  wind-leap:
    cooldown: 15
    velocity: 1.3
    burst-distance: 4.2
    speed-duration: 2
    speed-amplifier: 2
  wind-burst:
    cooldown: 15
    knockback-power: 2.0
    upward-power: 0.6
    radius: 6.0
name-en: Windweaver
lore-description-en:
- The weapon of a sky wanderer. Invisible currents lift its wielder and sweep enemies
  away.
lore-abilities-en:
- F — perform an aerial leap.
- Shift + F — charge and release a wind burst.
visuals:
  sounds:
    entity-wind-charge-wind-burst:
      sound: ENTITY_WIND_CHARGE_WIND_BURST
      volume-multiplier: 1.0
      pitch-multiplier: 1.0
    entity-breeze-inhale:
      sound: ENTITY_BREEZE_INHALE
      volume-multiplier: 1.0
      pitch-multiplier: 1.0
    entity-breeze-idle-ground:
      sound: ENTITY_BREEZE_IDLE_GROUND
      volume-multiplier: 1.0
      pitch-multiplier: 1.0
  particle-density: 1.0
messages:
  wind-weaver-listener:
    message-1:
      ru: §eВетровой Прыжок
      en: §eᴡɪɴᴅ ʟᴇᴀᴘ
    message-2:
      ru: §eПорыв Ветра
      en: §eᴡɪɴᴅ ʙᴜʀsᴛ
