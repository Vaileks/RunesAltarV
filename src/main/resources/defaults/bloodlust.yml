name-en: Bloodlust
lore-description-en:
- A sword of hardened blood. Every victory awakens its hunger and unlocks new power.
lore-abilities-en:
- Hit — infect an enemy with bleeding.
- Shift + F — leave a blood trail after 3 kills.
- F — launch a blood hook after 5 kills.
