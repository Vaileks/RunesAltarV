# Weapon settings. Damage: HP (2 HP = 1 heart). Durations ending in -ticks: 20 ticks = 1 second.
# Existing ability durations/cooldowns retain their original units. Potion amplifiers are zero-based unless stated otherwise.
# Tuning/visual fields keep original values by default. Reload with /al reload (integrated) or /rav reload (standalone).
# Sounds: enum names, relative volume/pitch multipliers. Particle density: 0..4. Attributes: additive main-hand bonuses.

name: Морозная коса
lore-description:
- Коса вечной зимы. Холод следует за каждым взмахом и повинуется её владельцу.
lore-abilities:
- ПКМ — метнуть косу с возвращением.
- Shift + F — направить лёд в противников.
item:
  material: TRIDENT
  custom-model-data: 4
  item-model: minecraft:netherite_sword
  tooltip-style: minecraft:frost
  projectile:
    material: NETHERITE_AXE
    custom-model-data: 1
    item-model: ''
  attack-damage-bonus: 0.0
  attack-speed-bonus: 0.0
abilities:
  throw:
    cooldown: 45
    damage: 20.0
    flight-speed: 1.65
    return-speed: 1.55
    interpolation-ticks: 2
  ice-command:
    cooldown: 65
    radius: 16.0
    damage: 15.0
    speed: 1.25
  freeze:
    damage: 3.5
name-en: Frost Scythe
lore-description-en:
- The scythe of an endless winter. Cold follows every swing and obeys its wielder.
lore-abilities-en:
- Right click — throw the scythe and call it back.
- Shift + F — command ice to strike your enemies.
