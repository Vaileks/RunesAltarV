# Weapon settings. Damage: HP (2 HP = 1 heart). Durations ending in -ticks: 20 ticks = 1 second.
# Existing ability durations/cooldowns retain their original units. Potion amplifiers are zero-based unless stated otherwise.
# Tuning/visual fields keep original values by default. Reload with /al reload (integrated) or /rav reload (standalone).
# Sounds: enum names, relative volume/pitch multipliers. Particle density: 0..4. Attributes: additive main-hand bonuses.

name: Бледный арбалет
lore-description:
- Тихое оружие мёртвого леса. Его выстрелы несут туман, а земля отвечает бледными
  корнями.
lore-abilities:
- Выстрел — взрывной снаряд с облаком ослабления.
- F — выпустить цепь бледных корней.
item:
  material: CROSSBOW
  custom-model-data: 2
  item-model: ''
  tooltip-style: minecraft:gold
  attack-damage-bonus: 0.0
  attack-speed-bonus: 0.0
abilities:
  shoot:
    cooldown: 10
    projectile-speed: 1.3
    gravity-per-tick: 0.03
    lifetime-ticks: 150
    explosion-power: 3.2
    blast-radius: 2.5
    cloud-duration-ticks: 160
    cloud-radius: 2.0
    effect-duration-ticks: 160
    effect-amplifier: 0
  pale-roots:
    cooldown: 25
    damage: 2.0
    duration-seconds: 8
    root-count: 5
    spawn-interval-ticks: 2
    step-distance: 1.05
    contact-hit-cooldown-ticks: 10
    max-hits-per-target: 3
  backstab:
    multiplier: 1.5
name-en: Pale Gun
lore-description-en:
- A silent weapon of the dead forest. Its shots carry mist as pale roots rise from
  the earth.
lore-abilities-en:
- Shoot — explosive projectile with a weakening cloud.
- F — release a chain of pale roots.
