    tier-2-kills: 8.0
    tier-1-kills: 4.0
name-en: Knightfall
lore-description-en:
- A fallen guardian's hammer. Victories restore its lost strength, chain and battle
  fury.
lore-abilities-en:
- Kills — evolve the weapon; F confirms an upgrade.
- F — use the grapple after unlocking it.
- Shift + F — throw the hammer after the final upgrade.
