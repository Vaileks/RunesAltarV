# Weapon settings. Damage: HP (2 HP = 1 heart). Durations ending in -ticks: 20 ticks = 1 second.
# Existing ability durations/cooldowns retain their original units. Potion amplifiers are zero-based unless stated otherwise.
# Tuning/visual fields keep original values by default. Reload with /al reload (integrated) or /rav reload (standalone).
# Sounds: enum names, relative volume/pitch multipliers. Particle density: 0..4. Attributes: additive main-hand bonuses.

name: Абордажная сабля
lore-description:
- Сабля капитана, не знавшего поражений. Её быстрые удары не оставляют времени на
  ответ.
lore-abilities:
- F — серия из тысячи порезов.
- Shift + F — парировать атаки и отбросить нападающего.
item:
  material: NETHERITE_SWORD
  custom-model-data: 11
  item-model: ''
  tooltip-style: minecraft:tidebreaker
  attack-damage-bonus: 0.0
  attack-speed-bonus: 0.0
abilities:
  thousand-cuts:
    cooldown: 45
    duration-ticks: 32
    hit-damage: 1.0
    attack-speed-bonus: 2.0
    slowness-amplifier: 0
    slowness-duration: 2
    speed-amplifier: 2
  parry:
    cooldown: 30
    max-duration-seconds: 4
    max-charges: 2
    slowness-amplifier: 0
    knockback-power: 0.65
name-en: Cutlass
lore-description-en:
- The blade of an undefeated captain. Its swift strikes leave no time to answer.
lore-abilities-en:
- F — unleash a thousand cuts.
- Shift + F — parry attacks and knock the attacker back.
