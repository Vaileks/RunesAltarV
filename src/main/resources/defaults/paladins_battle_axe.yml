    max-shockwave-damage: 10.0
    release-multiplier: 0.65
name-en: Paladin's Battle Axe
lore-description-en:
- The heavy axe of an ancient order. It absorbs the enemy's fury and returns it as
  a shockwave.
lore-abilities-en:
- F — slam the axe at your target and shatter the ground.
- Shift + F — absorb damage and release a shockwave.
