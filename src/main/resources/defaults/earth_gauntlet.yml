name: "Земляная перчатка"
lore-description:
- "Перчатка, несущая тяжесть гор. Под её ударом почва трескается, а вязкая земля удерживает врага."
lore-abilities:
- "F — подготовить метеоритный удар; следующий удар оглушает и отбрасывает."
- "Shift + F — оползень, замедляющий и помечающий цель."
- "F по помеченной цели — притянуть её."
