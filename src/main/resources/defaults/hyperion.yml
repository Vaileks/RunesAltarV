# Weapon settings. Damage: HP (2 HP = 1 heart). Durations ending in -ticks: 20 ticks = 1 second.
# Existing ability durations/cooldowns retain their original units. Potion amplifiers are zero-based unless stated otherwise.
# Tuning/visual fields keep original values by default. Reload with /al reload (integrated) or /rav reload (standalone).
# Sounds: enum names, relative volume/pitch multipliers. Particle density: 0..4. Attributes: additive main-hand bonuses.

name: Гиперион
lore-description:
- Солнечный клинок, в котором застыл жар звезды. Его свет обращается в обжигающее
  лезвие и небесное копьё.
lore-abilities:
- F — призвать святое копьё в выбранную точку.
- Shift + F — зарядить обжигающий клинок.
item:
  material: NETHERITE_SWORD
  custom-model-data: 6
  item-model: ''
  tooltip-style: minecraft:gold
  attack-damage-bonus: 0.0
  attack-speed-bonus: 0.0
abilities:
  scorching-blade:
    cooldown: 30
    pure-damage: 2.0
    magma-chance: 0.15
    place-real-lava: false
  holy-lance:
    cooldown: 60
    radius-damage: 2.5
    center-damage: 6.0
    radius: 2.5
  hallowed-flames:
    damage-per-second: 1.35
    duration-ticks: 60
name-en: Hyperion
lore-description-en:
- A solar blade holding the heat of a star. Its light becomes a scorching edge and
  a heavenly lance.
lore-abilities-en:
- F — summon a holy lance at the targeted location.
- Shift + F — charge the scorching blade.
